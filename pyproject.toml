[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeline"
version = "0.1.0"
description = "Wi-Fi-aware Ethernet DHCP router / failover client daemon with multi-laptop standby election for Ubuntu 26.04"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Vikram Aggarwal"}]
maintainers = [{name = "Vikram Aggarwal"}]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lifelined = "lifeline.daemon:main"
lifelinectl = "lifeline.cli:main"
lifeline-tray = "lifeline.tray:main"
lifeline-lease-hook = "lifeline.lease_hook:main"

[tool.setuptools.packages.find]
where = ["src"]
